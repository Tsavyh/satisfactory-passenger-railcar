name: Bug report / Informe de error
description: Report a startup or passenger-wagon issue without sharing private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use a test save and stop at the first failure. Do not upload credentials, account IDs, personal saves or full unredacted logs.
        Usa una partida de pruebas. No publiques credenciales, identificadores de cuentas ni logs completos sin revisar.
  - type: input
    id: version
    attributes:
      label: Mod version / Versión del mod
      placeholder: "0.1.13"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Game build, SML, OS and storefront / Entorno
      placeholder: "Game CL, SML version, Windows or Linux/Proton, Steam"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and steps / Qué ocurre y pasos
      description: Include the first failing step and expected behavior. State whether SML-only startup works.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Minimal redacted evidence / Evidencia mínima sin datos privados
      description: Paste only relevant error lines or a screenshot. Remove account IDs, authentication/travel URL parameters and personal paths.
