name: Standalone checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Show tool versions
        run: |
          "$CXX" --version
          python --version
          shellcheck --version
      - name: Policy checks (precise and fast-math)
        run: bash Tests/run-policy-tests.sh
      - name: Python contracts and Bash runner tests
        run: python -B -m unittest discover -s Tests -p 'test_*.py' -v
      - name: ShellCheck
        run: shellcheck Tests/run-policy-tests.sh

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Policy checks (MSVC precise and fast)
        run: |
          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%I"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          call Tests\run-policy-tests.cmd
          if errorlevel 1 exit /b 1
          python -B tools/run_routing_checks.py --output "%RUNNER_TEMP%/passenger-routing"
      - name: Native prerequisite contracts
        run: python -B -m unittest discover -s Tests -p test_native_prerequisite.py -v
      - name: Source snapshot and routing-runner contracts
        shell: python {0}
        run: |
          import subprocess
          import sys
          for pattern in ("test_source_manifest.py", "test_routing_ci.py"):
              subprocess.run([sys.executable, "-B", "-m", "unittest", "discover", "-s", "Tests", "-p", pattern, "-v"], check=True, timeout=120)
      - name: Routing result and failure logs
        if: always()
        shell: python {0}
        run: |
          import json
          import os
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "passenger-routing"
          if (output / "result.json").is_file():
              report = json.loads((output / "result.json").read_text())
              print(json.dumps(report, indent=2))
              if report["status"] != "PASS":
                  for path in sorted(output.glob("*.log")):
                      print(path.name, path.read_text(encoding="utf-8", errors="replace")[-24000:])
